plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jlleitschuh.gradle.ktlint'
    id 'maven-publish'
    id 'signing'
}

android {
    namespace 'com.ironsource.adapters.custom.velocityads'
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35
        buildConfigField("String", "ADAPTER_VERSION", "\"${VERSION_NAME}\"")
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    compileOnly "com.unity3d.ads-mediation:mediation-sdk:${levelPlaySdkVersion}"
    implementation "io.velocity:ads-sdk:${velocitySdkVersion}"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:2.1.21'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation "com.unity3d.ads-mediation:mediation-sdk:${levelPlaySdkVersion}"
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = GROUP
                artifactId = ARTIFACT_ID
                version = VERSION_NAME

                pom {
                    name = 'Velocity Ads LevelPlay Adapter'
                    description = 'Unity LevelPlay custom adapter for Velocity Ads SDK'
                    url = 'https://github.com/velocityiodev/velocityads-android-levelplay-adapter'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    developers {
                        developer {
                            id = 'velocityads'
                            name = 'Velocity Ads'
                            email = 'sdk@velocity.io'
                        }
                    }
                    scm {
                        connection = 'scm:git:github.com/velocityiodev/velocityads-android-levelplay-adapter.git'
                        developerConnection = 'scm:git:ssh://github.com/velocityiodev/velocityads-android-levelplay-adapter.git'
                        url = 'https://github.com/velocityiodev/velocityads-android-levelplay-adapter'
                    }
                }
            }
        }
    }

    signing {
        def signingKeyId = System.getenv("SIGNING_KEY_ID")
        def signingKey = System.getenv("SIGNING_KEY")
        def signingPass = System.getenv("SIGNING_PASSWORD")
        if (signingKey) {
            useInMemoryPgpKeys(signingKeyId, signingKey, signingPass)
            sign publishing.publications.release
        }
    }
}
