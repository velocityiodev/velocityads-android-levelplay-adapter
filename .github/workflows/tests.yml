name: CI – Tests

env:
  ADAPTER_MODULE: velocity-levelplay-adapter

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Verify Kotlin formatting
        run: ./gradlew :${{ env.ADAPTER_MODULE }}:ktlintCheck
      - name: Build and run unit tests
        run: ./gradlew :${{ env.ADAPTER_MODULE }}:build
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ env.ADAPTER_MODULE }}/build/reports/tests/
          retention-days: 7
